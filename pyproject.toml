[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neighbourhood"
version = "1.0.0"
description = "Discover hosts on directly connected IPv4 networks using ARP"
authors = [{ name = "Benedikt Waldvogel", email = "mail@bwaldvogel.de" }]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.8",
]

[project.scripts]
neighbourhood = "neighbourhood:cli"

[project.urls]
Repository = "https://github.com/bwaldvogel/neighbourhood"
Issues = "https://github.com/bwaldvogel/neighbourhood/issues"

[tool.setuptools]
py-modules = ["neighbourhood"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
