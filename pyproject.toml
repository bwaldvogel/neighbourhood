[project]
name = "neighbourhood"
version = "0.1.0"
description = "Layer 2 network neighbourhood discovery tool that uses scapy "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.8",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
